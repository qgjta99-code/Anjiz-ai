<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>إنجز AI | لوحة الإدارة</title>

<style>

*{box-sizing:border-box}

body{margin:0;font-family:Tahoma,Arial;background:#f3f6fb;color:#17233b}

header{background:#12213c;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}

h1{font-size:22px;margin:0}

main{max-width:1350px;margin:35px auto;padding:0 18px}

.card{background:white;padding:25px;border-radius:16px;box-shadow:0 4px 20px #15294b12;margin-bottom:20px}

.login{max-width:430px;margin:65px auto}

input,button,select{font:inherit;padding:12px;border-radius:9px}

input{width:100%;border:1px solid #d5dce8;margin:9px 0 17px}

button{background:#1269d3;color:white;border:0;cursor:pointer}

button:disabled{opacity:.6;cursor:wait}

.secondary{background:#e7ecf4;color:#17233b}

.error{color:#b42318}

.muted{color:#667085;font-size:14px}

.hidden{display:none!important}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}

table{width:100%;border-collapse:collapse;text-align:right;min-width:700px}

th,td{padding:13px;border-bottom:1px solid #e7ecf4}

th{background:#f8faff}

.tablewrap{overflow-x:auto}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin:15px 0}.toolbar label{display:block;font-weight:bold;font-size:13px}.toolbar input,.toolbar select{margin:5px 0 0;min-width:190px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}.stat{background:white;padding:18px;border-radius:14px;border:1px solid #e3e9f3}.stat strong{display:block;font-size:25px;color:#1269d3}.stat span{font-size:13px;color:#667085}.actions{display:flex;flex-wrap:wrap;gap:7px}.small{font-size:12px;padding:8px 10px}.description{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9;background:#f7f9fc;padding:14px;border-radius:12px;max-height:38vh;overflow-y:auto}.statusmsg{position:sticky;bottom:10px;background:#fff;padding:12px;border-radius:10px;box-shadow:0 3px 15px #15294b18;z-index:3}@media(max-width:700px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}header{gap:10px}h1{font-size:18px}}

select{border:1px solid #d5dce8;background:white}

#message{margin-top:15px}

/* تفاصيل الطلب في نافذة منبثقة */
.request-dialog{border:0;border-radius:20px;padding:0;width:min(760px,calc(100vw - 28px));max-height:min(90vh,900px);box-shadow:0 24px 85px #101b3999;color:#17233b;direction:rtl;overflow:hidden}
.request-dialog::backdrop{background:#0c1735ab;backdrop-filter:blur(3px)}
.modal-head{padding:20px 24px;background:#12213c;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-head h2{margin:0;font-size:20px}.modal-head .muted{color:#e2e8f0;margin:6px 0 0}
.modal-head .close-modal{background:#ffffff25;color:white;font-size:23px;line-height:1;padding:7px 13px}
.modal-body{overflow-y:auto;max-height:calc(90vh - 85px);padding:22px 24px}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.detail-item{background:#f7f9fc;padding:13px;border-radius:12px;min-width:0;overflow-wrap:anywhere}
.detail-label{display:block;color:#667085;font-size:12px;margin-bottom:6px}
.detail-value{font-weight:bold;white-space:pre-wrap;overflow-wrap:anywhere}
.detail-section{margin-top:20px;border-top:1px solid #e7ecf4;padding-top:17px}
.detail-section h3{margin:0 0 12px;font-size:16px}
.detail-section input[type=file]{width:100%;max-width:100%}
.status-pill{display:inline-block;border-radius:999px;padding:6px 12px;background:#e9f1ff;color:#1557a7;font-weight:bold;font-size:12px;white-space:nowrap}
.ticket-cell{white-space:nowrap;font-weight:bold}.details-btn{white-space:nowrap}
#requestsBody td{vertical-align:middle}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}.modal-body{padding:16px}.modal-head{padding:16px}.request-dialog{width:calc(100vw - 16px);max-height:93vh}.modal-body{max-height:calc(93vh - 75px)}}
</style>

</head>

<body>

<header>

<h1>إنجز AI | لوحة الإدارة</h1>

<button id="logout" class="secondary hidden">تسجيل الخروج</button>

</header>

<main>

<section id="loginSection" class="card login">

<h2>تسجيل دخول المدير</h2>

<p class="muted">الدخول للحسابات المخولة فقط</p>

<form id="loginForm">

<label for="email">البريد الإلكتروني</label>

<input id="email" type="email" required autocomplete="username">

<label for="password">كلمة المرور</label>

<input id="password" type="password" required autocomplete="current-password">

<button id="loginButton" type="submit">تسجيل الدخول</button>

</form>

<p id="loginError" class="error" role="alert"></p>

</section>

<section id="dashboard" class="hidden">

<div class="card top">

<div>

<h2>طلبات الخدمات</h2>

<p id="userEmail" class="muted"></p>

</div>

<button id="refresh" type="button">تحديث الطلبات</button>

</div>

<div class="stats" aria-label="ملخص الطلبات"><div class="stat"><strong id="statAll">0</strong><span>إجمالي الطلبات</span></div><div class="stat"><strong id="statNew">0</strong><span>جديد</span></div><div class="stat"><strong id="statProgress">0</strong><span>قيد التنفيذ</span></div><div class="stat"><strong id="statDone">0</strong><span>مكتمل</span></div></div>
<div class="card">
<div class="toolbar"><div><label for="searchRequests">بحث في الطلبات</label><input id="searchRequests" type="search" placeholder="رقم التذكرة، العميل، البريد..."></div><div><label for="filterStatus">تصفية الحالة</label><select id="filterStatus"><option value="">كل الحالات</option><option>جديد</option><option>قيد التنفيذ</option><option>مكتمل</option><option>ملغي</option></select></div><button id="clearFilters" type="button" class="secondary">مسح التصفية</button></div>
<p id="count" class="muted"></p>

<div class="tablewrap">

<table>

<thead>
<tr>
<th>رقم التذكرة</th>
<th>اسم العميل</th>
<th>نوع الخدمة</th>
<th>تاريخ الإرسال</th>
<th>الحالة</th>
<th>الإجراءات</th>
</tr>
</thead>

<tbody id="requestsBody"></tbody>

</table>

</div>

<p id="message" class="statusmsg" role="status" aria-live="polite"></p>

</div>

</section>

</main>

<script type="module">

import {createClient} from

"https://esm.sh/@supabase/supabase-js@2";

const supabase=createClient(

"https://bnpxabjepraxualaqcrm.supabase.co",

"sb_publishable_l_HWBu0-JCM5wbmYierWpg_CBSLhc53"

);

const $=id=>document.getElementById(id);

let currentUser=null;
let cachedRequests=[];
function updateStats(){
 const counts={};for(const r of cachedRequests)counts[r.status]=(counts[r.status]||0)+1;
 $("statAll").textContent=cachedRequests.length;
 $("statNew").textContent=counts["جديد"]||0;
 $("statProgress").textContent=counts["قيد التنفيذ"]||0;
 $("statDone").textContent=counts["مكتمل"]||0;
}
function applyFilters(){
 const q=$("searchRequests").value.trim().toLowerCase();
 const status=$("filterStatus").value;
 let visible=0;
 for(const tr of $("requestsBody").children){
  const matches=(!q||tr.dataset.search.includes(q))&&(!status||tr.dataset.status===status);
  tr.hidden=!matches;if(matches)visible++;
 }
 $("count").textContent=`عرض ${visible} من ${cachedRequests.length} طلب`;
}
$("searchRequests").addEventListener("input",applyFilters);
$("filterStatus").addEventListener("change",applyFilters);
$("clearFilters").addEventListener("click",()=>{$("searchRequests").value="";$("filterStatus").value="";applyFilters();});

function showLogin(error=""){

 $("dashboard").classList.add("hidden");

 $("logout").classList.add("hidden");

 $("loginSection").classList.remove("hidden");

 $("loginError").textContent=error;

 currentUser=null;
 cachedRequests=[];
}

function showDashboard(email){

 $("loginSection").classList.add("hidden");

 $("dashboard").classList.remove("hidden");

 $("logout").classList.remove("hidden");

 $("userEmail").textContent=email;

}

async function checkAdmin(){

 const {data:{user},error}=await supabase.auth.getUser();

 if(error||!user){

  showLogin();

  return;

 }

 const {data,error:roleError}=await supabase

  .from("admin_users")

  .select("user_id")

  .eq("user_id",user.id)

  .maybeSingle();

 if(roleError||!data){

  await supabase.auth.signOut();

  showLogin("هذا الحساب لا يملك صلاحية المدير");

  return;

 }

 currentUser=user;

 showDashboard(user.email||"");

 await loadRequests();

}

async function loadRequests(){

 if(!currentUser)return;

 $("message").textContent="جارٍ تحميل الطلبات...";

 $("requestsBody").replaceChildren();

 const {data,error}=await supabase

  .from("service_requests")

  .select("id,customer_name,customer_email,service_type,description,created_at,status,file_path,tracking_number,delivery_file_path,delivered_at")

  .order("created_at",{ascending:false});

 if(error){

  $("message").textContent="تعذر تحميل الطلبات: "+error.message;

  return;

 }

 cachedRequests=data||[];updateStats();

 $("message").textContent=data.length?"":"لا توجد طلبات حتى الآن";

 const statuses=["جديد","قيد التنفيذ","مكتمل","ملغي"];

 for(const request of data){

  const tr=document.createElement("tr");
   tr.dataset.status=request.status||"";
   tr.dataset.search=[request.tracking_number,request.customer_name,request.customer_email,request.service_type,request.description].join(" ").toLowerCase();

  const values=[
    request.tracking_number || "—",

   request.customer_name,

   request.customer_email,

   request.service_type,

   request.description,

   new Date(request.created_at).toLocaleString("ar-SA")

  ];

  for(const value of values){

   const td=document.createElement("td");

   td.textContent=value??"";

   tr.appendChild(td);

  }

  const fileTd=document.createElement("td");
  if(request.file_path){
    const fileButton=document.createElement("button");
    fileButton.type="button";
    fileButton.className="secondary small";
    fileButton.textContent="تحميل المرفق";
    fileButton.addEventListener("click",async()=>{
      fileButton.disabled=true;
      $("message").textContent="جارٍ تجهيز رابط المرفق...";
      try{
        const {data:{user},error:userError}=await supabase.auth.getUser();
        if(userError||!user||user.id!==currentUser?.id)throw new Error("انتهت جلسة المدير");
        const {data:admin,error:adminError}=await supabase.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
        if(adminError||!admin)throw new Error("الحساب غير مخوّل");
        const {data:link,error:linkError}=await supabase.storage.from("customer-files").createSignedUrl(request.file_path,60);
        if(linkError||!link?.signedUrl)throw new Error(linkError?.message||"تعذر إنشاء الرابط");
        const a=document.createElement("a");
        a.href=link.signedUrl;
        a.target="_blank";
        a.rel="noopener noreferrer";
        a.click();
        $("message").textContent="تم تجهيز رابط مؤقت لمدة 60 ثانية";
      }catch(err){
        $("message").textContent="تعذر فتح المرفق: "+err.message;
      }finally{fileButton.disabled=false;}
    });
    fileTd.appendChild(fileButton);
  }else{
    fileTd.textContent="لا يوجد";
  }
  tr.appendChild(fileTd);

  const deliveryTd=document.createElement("td");
  const deliveryInput=document.createElement("input");
  deliveryInput.type="file";
  deliveryInput.accept=".pdf,.doc,.docx,.xls,.xlsx,.zip";
  deliveryInput.setAttribute("aria-label","اختر ملف التسليم للتذكرة "+(request.tracking_number||""));
  deliveryInput.style.width="190px";
  deliveryInput.style.margin="0 0 8px";
  const uploadButton=document.createElement("button");
  uploadButton.type="button";
  uploadButton.textContent="رفع الملف النهائي";
   uploadButton.className="small";
  uploadButton.addEventListener("click",async()=>{
    const file=deliveryInput.files?.[0];
    if(!file){$("message").textContent="اختر ملف التسليم أولًا";return;}
    const extension=file.name.split(".").pop()?.toLowerCase();
    if(!["pdf","doc","docx","xls","xlsx","zip"].includes(extension)||file.size===0||file.size>10*1024*1024){
      $("message").textContent="اختر PDF أو Word أو Excel أو ZIP بحجم لا يتجاوز 10 MB";return;
    }
    if(request.delivery_file_path&&!confirm("يوجد ملف تسليم سابق. هل تريد رفع نسخة جديدة؟"))return;
    uploadButton.disabled=true;
    deliveryInput.disabled=true;
    $("message").textContent="جارٍ رفع الملف النهائي...";
    let uploadedPath=null;
    try{
      const {data:{user},error:userError}=await supabase.auth.getUser();
      if(userError||!user||user.id!==currentUser?.id)throw new Error("انتهت جلسة المدير");
      const {data:admin,error:adminError}=await supabase.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
      if(adminError||!admin)throw new Error("الحساب غير مخوّل");
      const path=request.id+"/"+crypto.randomUUID()+"."+extension;
      const {error:uploadError}=await supabase.storage.from("completed-files").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
      if(uploadError)throw uploadError;
      uploadedPath=path;
      const {data:updated,error:updateError}=await supabase.from("service_requests")
        .update({delivery_file_path:path,delivered_at:new Date().toISOString()})
        .eq("id",request.id).select("id,delivery_file_path").single();
      if(updateError||!updated)throw updateError||new Error("تعذر ربط الملف بالطلب. تحقق من صلاحية تحديث الطلبات");
      request.delivery_file_path=path;
      deliveryStatus.textContent="ملف نهائي جاهز للاستلام بعد التحقق بالبريد";
      $("message").textContent="تم رفع الملف وربطه بالتذكرة "+(request.tracking_number||"")+". يمكن للعميل استلامه برمز البريد.";
      deliveryInput.value="";
       await loadRequests();
    }catch(err){
      if(uploadedPath)await supabase.storage.from("completed-files").remove([uploadedPath]);
      $("message").textContent="فشل رفع ملف التسليم: "+(err?.message||"خطأ غير معروف");
    }finally{uploadButton.disabled=false;deliveryInput.disabled=false;}
  });
  const deliveryStatus=document.createElement("div");
  deliveryStatus.className="muted";
  deliveryStatus.textContent=request.delivery_file_path?"ملف نهائي جاهز للاستلام":"لم يُرفع ملف نهائي";
  deliveryTd.append(deliveryInput,uploadButton,deliveryStatus);
   if(request.delivery_file_path){
    const preview=document.createElement("button");preview.type="button";preview.className="secondary small";preview.textContent="فتح ملف التسليم";
    preview.addEventListener("click",async()=>{
      preview.disabled=true;
      try{
        const {data:{user},error:userError}=await supabase.auth.getUser();
        if(userError||!user||user.id!==currentUser?.id)throw new Error("انتهت جلسة المدير");
        const {data:admin,error:adminError}=await supabase.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
        if(adminError||!admin)throw new Error("الحساب غير مخوّل");
        const {data:link,error}=await supabase.storage.from("completed-files").createSignedUrl(request.delivery_file_path,60);
        if(error||!link?.signedUrl)throw error||new Error("تعذر إنشاء الرابط");
        window.open(link.signedUrl,"_blank","noopener,noreferrer");
      }catch(err){$("message").textContent="تعذر فتح ملف التسليم: "+(err.message||"خطأ");}
      finally{preview.disabled=false;}
    });
    deliveryTd.append(preview);
   }
  tr.appendChild(deliveryTd);

  const td=document.createElement("td");

  const select=document.createElement("select");

  for(const status of statuses){

   const option=document.createElement("option");

   option.value=status;

   option.textContent=status;

   option.selected=request.status===status;

   select.appendChild(option);

  }

  select.addEventListener("change",async()=>{

   const previous=request.status;

   select.disabled=true;

   $("message").textContent="جارٍ حفظ التعديل...";

   const {error}=await supabase

    .from("service_requests")

    .update({status:select.value})

    .eq("id",request.id);

   if(error){

    select.value=previous;

    $("message").textContent="فشل الحفظ: "+(error?.message||"لم يتم تأكيد التحديث");

   }else{

    request.status=select.value;

    $("message").textContent="تم حفظ الحالة";

   }

   select.disabled=false;

  });

  td.appendChild(select);

  tr.appendChild(td);

   // Keep the original authenticated attachment, delivery and status controls,
   // but move them into a popup rather than stretching the table row.
   const cells=Array.from(tr.cells);
   const dialog=document.createElement("dialog");
   dialog.className="request-dialog";
   dialog.setAttribute("aria-label","تفاصيل الطلب "+(request.tracking_number||""));

   const head=document.createElement("div");head.className="modal-head";
   const headText=document.createElement("div");
   const heading=document.createElement("h2");heading.textContent="تفاصيل الطلب";
   const ticketSubtitle=document.createElement("p");ticketSubtitle.className="muted";
   ticketSubtitle.textContent=request.tracking_number||"بدون رقم تذكرة";
   headText.append(heading,ticketSubtitle);
   const close=document.createElement("button");close.type="button";close.className="close-modal";
   close.textContent="×";close.setAttribute("aria-label","إغلاق التفاصيل");
   close.addEventListener("click",()=>dialog.close());
   head.append(headText,close);

   const body=document.createElement("div");body.className="modal-body";
   const grid=document.createElement("div");grid.className="detail-grid";
   for(const [label,value] of [
     ["رقم التذكرة",request.tracking_number],["اسم العميل",request.customer_name],
     ["البريد الإلكتروني",request.customer_email],["نوع الخدمة",request.service_type],
     ["تاريخ الإرسال",request.created_at?new Date(request.created_at).toLocaleString("ar-SA"):"—"],
     ["تاريخ التسليم",request.delivered_at?new Date(request.delivered_at).toLocaleString("ar-SA"):"لم يتم التسليم"]
   ]){
     const item=document.createElement("div");item.className="detail-item";
     const labelEl=document.createElement("span");labelEl.className="detail-label";labelEl.textContent=label;
     const valueEl=document.createElement("div");valueEl.className="detail-value";valueEl.textContent=value??"—";
     item.append(labelEl,valueEl);grid.appendChild(item);
   }
   body.appendChild(grid);

   function addDetailSection(label, content){
     const section=document.createElement("section");section.className="detail-section";
     const title=document.createElement("h3");title.textContent=label;section.appendChild(title);
     if(content instanceof Node)section.appendChild(content);
     else {const text=document.createElement("div");text.textContent=content??"—";section.appendChild(text);}
     body.appendChild(section);
   }
   const description=document.createElement("div");description.className="description";
   description.textContent=request.description||"لا يوجد وصف";
   addDetailSection("الوصف الكامل",description);

   // Move existing controls without changing Supabase permissions or handlers.
   const attachment=document.createElement("div");
   while(cells[6].firstChild)attachment.appendChild(cells[6].firstChild);
   addDetailSection("مرفقات العميل",attachment);
   const delivery=document.createElement("div");
   while(cells[7].firstChild)delivery.appendChild(cells[7].firstChild);
   addDetailSection("ملف التسليم النهائي",delivery);
   const statusControl=document.createElement("div");
   while(cells[8].firstChild)statusControl.appendChild(cells[8].firstChild);
   addDetailSection("تغيير حالة الطلب",statusControl);
   dialog.append(head,body);
   dialog.addEventListener("click",event=>{if(event.target===dialog)dialog.close();});
   document.body.appendChild(dialog);

   // Compact table: ticket, customer, service, date, status, details.
   for(const index of [8,7,6,4,2])cells[index].remove();
   cells[0].classList.add("ticket-cell");
   const statusDisplay=document.createElement("td");
   const pill=document.createElement("span");pill.className="status-pill";pill.textContent=request.status||"—";
   statusDisplay.appendChild(pill);tr.appendChild(statusDisplay);
   const detailsCell=document.createElement("td");
   const open=document.createElement("button");open.type="button";
   open.className="small details-btn";open.textContent="عرض التفاصيل";
   open.addEventListener("click",()=>dialog.showModal());
   detailsCell.appendChild(open);tr.appendChild(detailsCell);
  $("requestsBody").appendChild(tr);

 }
 applyFilters();

}

$("loginForm").addEventListener("submit",async event=>{

 event.preventDefault();

 $("loginError").textContent="";

 $("loginButton").disabled=true;

 const {error}=await supabase.auth.signInWithPassword({

  email:$("email").value.trim(),

  password:$("password").value

 });

 $("password").value="";

 $("loginButton").disabled=false;

 if(error){

  showLogin("فشل تسجيل الدخول. تحقق من بيانات الحساب.");

  return;

 }

 await checkAdmin();

});

$("logout").addEventListener("click",async()=>{

 await supabase.auth.signOut();

 showLogin();

});

$("refresh").addEventListener("click",loadRequests);

await checkAdmin();

</script>

</body>

</html>
